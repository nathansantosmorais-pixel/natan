<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento - Gerador de GR e CPF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #00d2ff;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .vagas-box {
            background: rgba(0, 210, 255, 0.15);
            border: 2px solid #00d2ff;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .vagas-numero {
            font-size: 3.5rem;
            font-weight: bold;
            color: #00d2ff;
            line-height: 1;
        }

        .vagas-texto {
            font-size: 1.1rem;
            margin-top: 5px;
            color: #ccc;
        }

        .botoes {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-estacionar {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #fff;
        }

        .btn-estacionar:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.4);
        }

        .btn-liberar {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
        }

        .btn-liberar:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
        }

        .btn-limpar {
            background: #333;
            color: #fff;
        }

        .btn-limpar:hover {
            background: #444;
        }

        .lista-veiculos {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .veiculo {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 5px solid #00d2ff;
            animation: entrar 0.4s ease;
        }

        @keyframes entrar {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .veiculo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .placa {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00d2ff;
        }

        .hora {
            font-size: 0.85rem;
            color: #aaa;
        }

        .info {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ddd;
        }

        .info span {
            color: #96c93d;
            font-weight: 600;
        }

        .vazio {
            text-align: center;
            color: #777;
            padding: 40px 20px;
            font-style: italic;
        }

        /* Scrollbar personalizada */
        .lista-veiculos::-webkit-scrollbar {
            width: 8px;
        }
        .lista-veiculos::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .lista-veiculos::-webkit-scrollbar-thumb {
            background: #00d2ff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Estacionamento Digital</h1>
        <p class="subtitle">Gera CPF + GR automaticamente • Controle de vagas</p>

        <div class="vagas-box">
            <div class="vagas-numero" id="vagasSobrando">12</div>
            <div class="vagas-texto">vagas sobrando</div>
        </div>

        <div class="botoes">
            <button class="btn-estacionar" onclick="estacionar()">Estacionar Veículo</button>
            <button class="btn-liberar" onclick="liberar()">Liberar 1 Vaga</button>
            <button class="btn-limpar" onclick="limparTudo()">Limpar Tudo</button>
        </div>

        <div class="lista-veiculos" id="lista">
            <div class="vazio">Nenhum veículo estacionado ainda...</div>
        </div>
    </div>

    <script>
        // Configuração inicial
        let vagasTotais = 12;
        let vagasOcupadas = 0;
        let veiculos = [];

        // Gera CPF válido (com dígitos verificadores corretos)
        function gerarCPF() {
            const n = Array.from({length: 9}, () => Math.floor(Math.random() * 10));
            
            // Primeiro dígito verificador
            let d1 = n.reduce((acc, num, i) => acc + num * (10 - i), 0) % 11;
            d1 = d1 < 2 ? 0 : 11 - d1;
            
            // Segundo dígito verificador
            let d2 = [...n, d1].reduce((acc, num, i) => acc + num * (11 - i), 0) % 11;
            d2 = d2 < 2 ? 0 : 11 - d2;

            const cpf = [...n, d1, d2].join('');
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        }

        // Gera GR (Guia de Recolhimento fictícia)
        function gerarGR() {
            const ano = new Date().getFullYear();
            const seq = String(Math.floor(Math.random() * 999999)).padStart(6, '0');
            const controle = String(Math.floor(Math.random() * 99)).padStart(2, '0');
            return `GR-${ano}-${seq}-${controle}`;
        }

        // Gera placa aleatória (padrão Mercosul)
        function gerarPlaca() {
            const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const l1 = letras[Math.floor(Math.random() * 26)];
            const l2 = letras[Math.floor(Math.random() * 26)];
            const l3 = letras[Math.floor(Math.random() * 26)];
            const n1 = Math.floor(Math.random() * 10);
            const l4 = letras[Math.floor(Math.random() * 26)];
            const n2 = Math.floor(Math.random() * 10);
            const n3 = Math.floor(Math.random() * 10);
            return `${l1}${l2}${l3}${n1}${l4}${n2}${n3}`;
        }

        // Formata hora atual
        function horaAtual() {
            const agora = new Date();
            return agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        // Atualiza o contador de vagas
        function atualizarVagas() {
            const sobrando = vagasTotais - vagasOcupadas;
            document.getElementById('vagasSobrando').textContent = sobrando;
            
            // Muda a cor se estiver quase cheio
            const box = document.querySelector('.vagas-box');
            if (sobrando <= 3) {
                box.style.borderColor = '#ff416c';
                document.getElementById('vagasSobrando').style.color = '#ff416c';
            } else {
                box.style.borderColor = '#00d2ff';
                document.getElementById('vagasSobrando').style.color = '#00d2ff';
            }
        }

        // Renderiza a lista de veículos
        function renderizar() {
            const lista = document.getElementById('lista');
            
            if (veiculos.length === 0) {
                lista.innerHTML = '<div class="vazio">Nenhum veículo estacionado ainda...</div>';
                return;
            }

            lista.innerHTML = veiculos.map((v, i) => `
                <div class="veiculo">
                    <div class="veiculo-header">
                        <div class="placa">${v.placa}</div>
                        <div class="hora">${v.hora}</div>
                    </div>
                    <div class="info">
                        CPF: <span>${v.cpf}</span><br>
                        GR: <span>${v.gr}</span>
                    </div>
                </div>
            `).join('');
        }

        // Estacionar veículo
        function estacionar() {
            if (vagasOcupadas >= vagasTotais) {
                alert('🚫 Estacionamento lotado! Não há vagas sobrando.');
                return;
            }

            const veiculo = {
                placa: gerarPlaca(),
                cpf: gerarCPF(),
                gr: gerarGR(),
                hora: horaAtual()
            };

            veiculos.unshift(veiculo); // adiciona no topo
            vagasOcupadas++;
            
            atualizarVagas();
            renderizar();
        }

        // Liberar 1 vaga (remove o mais antigo)
        function liberar() {
            if (vagasOcupadas === 0) {
                alert('Não há veículos para liberar.');
                return;
            }

            veiculos.pop(); // remove o último (mais antigo)
            vagasOcupadas--;
            
            atualizarVagas();
            renderizar();
        }

        // Limpar tudo
        function limparTudo() {
            if (confirm('Tem certeza que deseja liberar todas as vagas?')) {
                veiculos = [];
                vagasOcupadas = 0;
                atualizarVagas();
                renderizar();
            }
        }

        // Inicializa
        atualizarVagas();
    </script>
</body>
</html>
