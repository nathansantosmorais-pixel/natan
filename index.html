<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Digital - Nome + Entrada + Saída</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.9rem;
            color: #00d2ff;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .vagas-box {
            background: rgba(0, 210, 255, 0.12);
            border: 2px solid #00d2ff;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .vagas-numero {
            font-size: 3.8rem;
            font-weight: 700;
            color: #00d2ff;
            line-height: 1;
        }

        .vagas-texto {
            font-size: 1.1rem;
            margin-top: 6px;
            color: #ccc;
        }

        .botoes {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-estacionar {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
        }

        .btn-estacionar:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.45);
        }

        .btn-limpar {
            background: #2c2c2c;
            color: #eee;
        }

        .btn-limpar:hover {
            background: #3d3d3d;
        }

        .lista-veiculos {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .veiculo {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            border-left: 5px solid #00d2ff;
            animation: entrar 0.35s ease;
            position: relative;
        }

        @keyframes entrar {
            from { opacity: 0; transform: translateX(-25px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .veiculo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nome-pessoa {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .nome-veiculo {
            font-size: 0.95rem;
            color: #00d2ff;
            margin-top: 2px;
        }

        .placa {
            background: #111;
            color: #00d2ff;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 1.05rem;
            border: 1px solid #00d2ff;
        }

        .vaga-numero {
            position: absolute;
            top: 14px;
            right: 16px;
            background: #00d2ff;
            color: #000;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 4px 11px;
            border-radius: 20px;
        }

        .info {
            font-size: 0.93rem;
            line-height: 1.65;
            color: #ccc;
            margin-top: 8px;
        }

        .info span {
            color: #96c93d;
            font-weight: 600;
        }

        .horarios {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .horario {
            background: rgba(255,255,255,0.06);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .horario strong {
            color: #00d2ff;
        }

        .btn-saida {
            margin-top: 12px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 8px;
            width: auto;
            min-width: auto;
        }

        .btn-saida:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 65, 108, 0.4);
        }

        .vazio {
            text-align: center;
            color: #666;
            padding: 50px 20px;
            font-style: italic;
            font-size: 1.05rem;
        }

        .lista-veiculos::-webkit-scrollbar {
            width: 8px;
        }
        .lista-veiculos::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .lista-veiculos::-webkit-scrollbar-thumb {
            background: #00d2ff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Estacionamento Digital</h1>
        <p class="subtitle">Vagas 1 a 30 • Nome da Pessoa • Entrada e Saída</p>

        <div class="vagas-box" id="vagasBox">
            <div class="vagas-numero" id="vagasSobrando">30</div>
            <div class="vagas-texto">vagas sobrando</div>
        </div>

        <div class="botoes">
            <button class="btn-estacionar" onclick="estacionar()">Estacionar Veículo</button>
            <button class="btn-limpar" onclick="limparTudo()">Limpar Tudo</button>
        </div>

        <div class="lista-veiculos" id="lista">
            <div class="vazio">Nenhum veículo estacionado ainda...</div>
        </div>
    </div>

    <script>
        const TOTAL_VAGAS = 30;
        let vagasOcupadas = [];
        let vagasLivres = Array.from({ length: TOTAL_VAGAS }, (_, i) => i + 1);

        // Nomes de pessoas (brasileiros)
        const nomesPessoas = [
            "Ana Silva", "João Santos", "Maria Oliveira", "Pedro Costa", "Juliana Souza",
            "Carlos Pereira", "Fernanda Lima", "Lucas Almeida", "Patrícia Rocha", "Rafael Martins",
            "Camila Ferreira", "Bruno Carvalho", "Larissa Gomes", "Gabriel Ribeiro", "Beatriz Nunes",
            "Thiago Barbosa", "Amanda Dias", "Felipe Araujo", "Isabela Monteiro", "Rodrigo Mendes",
            "Mariana Castro", "André Moreira", "Letícia Pinto", "Gustavo Teixeira", "Sofia Cardoso",
            "Diego Ramos", "Vitória Correia", "Matheus Nascimento", "Laura Freitas", "Eduardo Vieira"
        ];

        // Nomes de veículos
        const nomesVeiculos = [
            "Volkswagen Gol", "Chevrolet Onix", "Fiat Argo", "Hyundai HB20",
            "Toyota Corolla", "Honda Civic", "Volkswagen Polo", "Fiat Mobi",
            "Renault Kwid", "Jeep Compass", "Toyota Hilux", "Ford Ranger",
            "Chevrolet Tracker", "Volkswagen T-Cross", "Honda HR-V", "Nissan Kicks",
            "Fiat Strada", "Volkswagen Saveiro", "Toyota Yaris", "Chevrolet Cruze",
            "Hyundai Creta", "Jeep Renegade", "Fiat Toro", "Volkswagen Virtus",
            "Honda City", "Nissan Versa", "Renault Duster", "Mitsubishi L200"
        ];

        function gerarCPF() {
            const n = Array.from({ length: 9 }, () => Math.floor(Math.random() * 10));
            let d1 = n.reduce((acc, num, i) => acc + num * (10 - i), 0) % 11;
            d1 = d1 < 2 ? 0 : 11 - d1;
            let d2 = [...n, d1].reduce((acc, num, i) => acc + num * (11 - i), 0) % 11;
            d2 = d2 < 2 ? 0 : 11 - d2;
            const cpf = [...n, d1, d2].join('');
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        }

        function gerarGR() {
            const ano = new Date().getFullYear();
            const seq = String(Math.floor(Math.random() * 999999)).padStart(6, '0');
            const controle = String(Math.floor(Math.random() * 99)).padStart(2, '0');
            return `GR-${ano}-${seq}-${controle}`;
        }

        function gerarPlaca() {
            const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            return `${letras[Math.floor(Math.random()*26)]}${letras[Math.floor(Math.random()*26)]}${letras[Math.floor(Math.random()*26)]}${Math.floor(Math.random()*10)}${letras[Math.floor(Math.random()*26)]}${Math.floor(Math.random()*10)}${Math.floor(Math.random()*10)}`;
        }

        function gerarNomePessoa() {
            return nomesPessoas[Math.floor(Math.random() * nomesPessoas.length)];
        }

        function gerarNomeVeiculo() {
            return nomesVeiculos[Math.floor(Math.random() * nomesVeiculos.length)];
        }

        function horaAtual() {
            return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function atualizarVagas() {
            const sobrando = vagasLivres.length;
            document.getElementById('vagasSobrando').textContent = sobrando;

            const box = document.getElementById('vagasBox');
            const numero = document.getElementById('vagasSobrando');

            if (sobrando <= 5) {
                box.style.borderColor = '#ff416c';
                numero.style.color = '#ff416c';
            } else if (sobrando <= 12) {
                box.style.borderColor = '#f7b731';
                numero.style.color = '#f7b731';
            } else {
                box.style.borderColor = '#00d2ff';
                numero.style.color = '#00d2ff';
            }
        }

        function renderizar() {
            const lista = document.getElementById('lista');

            if (vagasOcupadas.length === 0) {
                lista.innerHTML = '<div class="vazio">Nenhum veículo estacionado ainda...</div>';
                return;
            }

            const ordenados = [...vagasOcupadas].sort((a, b) => a.vaga - b.vaga);

            lista.innerHTML = ordenados.map((v, index) => `
                <div class="veiculo">
                    <div class="vaga-numero">Vaga ${String(v.vaga).padStart(2, '0')}</div>
                    
                    <div class="veiculo-header">
                        <div>
                            <div class="nome-pessoa">${v.pessoa}</div>
                            <div class="nome-veiculo">${v.veiculo}</div>
                        </div>
                        <div class="placa">${v.placa}</div>
                    </div>

                    <div class="info">
                        CPF: <span>${v.cpf}</span><br>
                        GR: <span>${v.gr}</span>
                    </div>

                    <div class="horarios">
                        <div class="horario">
                            <strong>Entrada:</strong> ${v.entrada}
                        </div>
                        <div class="horario">
                            <strong>Saída:</strong> ${v.saida ? v.saida : '—'}
                        </div>
                    </div>

                    ${!v.saida ? `
                        <button class="btn-saida" onclick="registrarSaida(${v.vaga})">
                            Registrar Saída
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        function estacionar() {
            if (vagasLivres.length === 0) {
                alert('🚫 Estacionamento lotado!\nTodas as 30 vagas estão ocupadas.');
                return;
            }

            const numeroVaga = vagasLivres.shift();

            const veiculo = {
                vaga: numeroVaga,
                pessoa: gerarNomePessoa(),
                veiculo: gerarNomeVeiculo(),
                placa: gerarPlaca(),
                cpf: gerarCPF(),
                gr: gerarGR(),
                entrada: horaAtual(),
                saida: null
            };

            vagasOcupadas.push(veiculo);
            atualizarVagas();
            renderizar();
        }

        function registrarSaida(numeroVaga) {
            const index = vagasOcupadas.findIndex(v => v.vaga === numeroVaga);
            if (index === -1) return;

            // Registra a saída
            vagasOcupadas[index].saida = horaAtual();
            renderizar();

            // Após 1.5 segundos libera a vaga
            setTimeout(() => {
                const liberado = vagasOcupadas.splice(index, 1)[0];
                vagasLivres.push(liberado.vaga);
                vagasLivres.sort((a, b) => a - b);
                atualizarVagas();
                renderizar();
            }, 1500);
        }

        function limparTudo() {
            if (vagasOcupadas.length === 0) return;

            if (confirm('Tem certeza que deseja liberar todas as vagas?')) {
                vagasOcupadas = [];
                vagasLivres = Array.from({ length: TOTAL_VAGAS }, (_, i) => i + 1);
                atualizarVagas();
                renderizar();
            }
        }

        // Inicializa
        atualizarVagas();
    </script>
</body>
</html>
