<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Digital - Cobrança + Ticket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000;
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px 15px;
        }

        .container {
            background: #111;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.85rem;
            color: #fff;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 22px;
            font-size: 0.93rem;
        }

        /* LOGIN */
        #tela-login {
            max-width: 400px;
            margin: 40px auto 0;
        }

        .form-login, .form-cadastro {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-login label, .form-cadastro label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 4px;
            display: block;
        }

        .form-login input, .form-cadastro input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #000;
            color: #fff;
            font-size: 1rem;
        }

        .form-login input:focus, .form-cadastro input:focus {
            outline: none;
            border-color: #fff;
        }

        .btn-login, .btn-salvar, .btn-estacionar, .btn-imprimir {
            background: #fff;
            color: #000;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-login:hover, .btn-salvar:hover, .btn-estacionar:hover, .btn-imprimir:hover {
            background: #ddd;
        }

        .erro-login {
            color: #ff6b6b;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        /* MENU */
        .menu {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .menu button {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: #1a1a1a;
            color: #ccc;
            transition: 0.2s;
        }

        .menu button.ativo {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .menu button:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .tela {
            display: none;
        }

        .tela.ativa {
            display: block;
        }

        .botoes-acao {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-estacionar {
            flex: 1;
            min-width: 160px;
        }

        .btn-limpar {
            background: #222;
            color: #fff;
            flex: 1;
            min-width: 140px;
            padding: 13px;
            border: 1px solid #555;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-limpar:hover {
            background: #333;
        }

        .selecao-cliente {
            background: #1a1a1a;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            border: 1px solid #333;
        }

        .selecao-cliente label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .selecao-cliente select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #000;
            color: #fff;
            font-size: 1rem;
        }

        .lista-veiculos {
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .veiculo {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #fff;
            border: 1px solid #333;
        }

        .nome-pessoa {
            font-size: 1.12rem;
            font-weight: 700;
            color: #fff;
        }

        .nome-veiculo {
            font-size: 0.92rem;
            color: #ccc;
            margin-top: 2px;
        }

        .placa {
            background: #000;
            color: #fff;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.95rem;
            border: 1px solid #fff;
            display: inline-block;
            margin-top: 6px;
        }

        .info {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #bbb;
            margin-top: 8px;
        }

        .info span {
            color: #fff;
            font-weight: 600;
        }

        .horarios {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
            font-size: 0.88rem;
        }

        .horario {
            background: #111;
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .horario strong {
            color: #fff;
        }

        .btn-saida {
            margin-top: 12px;
            background: #fff;
            color: #000;
            padding: 8px 14px;
            font-size: 0.88rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-saida:hover {
            background: #ddd;
        }

        .cliente-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid #fff;
            border: 1px solid #333;
        }

        .cliente-nome {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .cliente-info {
            font-size: 0.9rem;
            color: #bbb;
            line-height: 1.5;
        }

        .cliente-info span {
            color: #fff;
        }

        .vazio {
            text-align: center;
            color: #666;
            padding: 45px 20px;
            font-style: italic;
        }

        .btn-sair {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 15px;
            width: 100%;
        }

        .btn-sair:hover {
            background: #222;
            color: #fff;
        }

        /* ===== TICKET / COBRANÇA ===== */
        .modal-ticket {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-ticket.ativo {
            display: flex;
        }

        .ticket {
            background: #fff;
            color: #000;
            width: 100%;
            max-width: 380px;
            padding: 25px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .ticket h2 {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 5px;
            border-bottom: 2px dashed #000;
            padding-bottom: 10px;
        }

        .ticket .empresa {
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 15px;
            color: #333;
        }

        .ticket .linha {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 0.95rem;
        }

        .ticket .total {
            border-top: 2px dashed #000;
            margin-top: 15px;
            padding-top: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .ticket .botoes-ticket {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .ticket .botoes-ticket button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-fechar-ticket {
            background: #222;
            color: #fff;
        }

        .precos {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .precos strong {
            color: #fff;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .ticket, .ticket * {
                visibility: visible;
            }
            .ticket {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
            }
            .botoes-ticket {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Estacionamento Digital</h1>
        <p class="subtitle" id="subtitulo">Faça login para continuar</p>

        <!-- LOGIN -->
        <div id="tela-login" class="tela ativa">
            <form class="form-login" onsubmit="fazerLogin(event)">
                <div>
                    <label>Usuário</label>
                    <input type="text" id="usuario" required placeholder="Digite o usuário">
                </div>
                <div>
                    <label>Senha</label>
                    <input type="password" id="senha" required placeholder="Digite a senha">
                </div>
                <button type="submit" class="btn-login">Entrar</button>
                <div class="erro-login" id="erroLogin">Usuário ou senha incorretos</div>
            </form>
        </div>

        <!-- SISTEMA -->
        <div id="sistema" style="display: none;">
            <div class="menu">
                <button class="ativo" onclick="mostrarTela('cadastro', this)">Cadastrar Cliente</button>
                <button onclick="mostrarTela('clientes', this)">Clientes Cadastrados</button>
                <button onclick="mostrarTela('estacionamento', this)">Estacionamento</button>
            </div>

            <!-- CADASTRO -->
            <div id="tela-cadastro" class="tela ativa">
                <form class="form-cadastro" onsubmit="cadastrarCliente(event)">
                    <div>
                        <label>Nome Completo *</label>
                        <input type="text" id="nomeCliente" required placeholder="Ex: Ana Silva">
                    </div>
                    <div>
                        <label>CPF *</label>
                        <input type="text" id="cpfCliente" required placeholder="000.000.000-00" maxlength="14">
                    </div>
                    <div>
                        <label>Telefone</label>
                        <input type="text" id="telefoneCliente" placeholder="(11) 99999-9999">
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" id="emailCliente" placeholder="email@exemplo.com">
                    </div>
                    <button type="submit" class="btn-salvar">Salvar Cliente</button>
                </form>
            </div>

            <!-- CLIENTES -->
            <div id="tela-clientes" class="tela">
                <div id="listaClientes">
                    <div class="vazio">Nenhum cliente cadastrado ainda...</div>
                </div>
            </div>

            <!-- ESTACIONAMENTO -->
            <div id="tela-estacionamento" class="tela">
                <div class="precos">
                    <strong>Tabela de Preços:</strong><br>
                    Até 1 hora → R$ 12,00<br>
                    Cada hora adicional → R$ 6,00
                </div>

                <div class="selecao-cliente">
                    <label>Selecionar Cliente (opcional):</label>
                    <select id="selectCliente">
                        <option value="">-- Gerar cliente aleatório --</option>
                    </select>
                </div>

                <div class="botoes-acao">
                    <button class="btn-estacionar" onclick="estacionar()">Estacionar Veículo</button>
                    <button class="btn-limpar" onclick="limparTudo()">Limpar Tudo</button>
                </div>

                <div class="lista-veiculos" id="lista">
                    <div class="vazio">Nenhum veículo estacionado ainda...</div>
                </div>
            </div>

            <button class="btn-sair" onclick="sair()">Sair do Sistema</button>
        </div>
    </div>

    <!-- MODAL DO TICKET -->
    <div class="modal-ticket" id="modalTicket">
        <div class="ticket" id="conteudoTicket">
            <!-- preenchido via JS -->
        </div>
    </div>

    <script>
        const USUARIO_CORRETO = "admin";
        const SENHA_CORRETA = "1234";

        const TOTAL_VAGAS = 30;
        let vagasOcupadas = [];
        let vagasLivres = Array.from({ length: TOTAL_VAGAS }, (_, i) => i + 1);
        let clientes = [];
        let veiculoSaindo = null; // guarda o veículo que está saindo

        const nomesPessoas = [
            "Ana Silva", "João Santos", "Maria Oliveira", "Pedro Costa", "Juliana Souza",
            "Carlos Pereira", "Fernanda Lima", "Lucas Almeida", "Patrícia Rocha", "Rafael Martins"
        ];

        const nomesVeiculos = [
            "Volkswagen Gol", "Chevrolet Onix", "Fiat Argo", "Hyundai HB20", "Toyota Corolla",
            "Honda Civic", "Volkswagen Polo", "Fiat Mobi", "Renault Kwid", "Jeep Compass"
        ];

        function gerarCPF() {
            const n = Array.from({ length: 9 }, () => Math.floor(Math.random() * 10));
            let d1 = n.reduce((acc, num, i) => acc + num * (10 - i), 0) % 11;
            d1 = d1 < 2 ? 0 : 11 - d1;
            let d2 = [...n, d1].reduce((acc, num, i) => acc + num * (11 - i), 0) % 11;
            d2 = d2 < 2 ? 0 : 11 - d2;
            return [...n, d1, d2].join('').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        }

        function gerarGR() {
            const ano = new Date().getFullYear();
            const seq = String(Math.floor(Math.random() * 999999)).padStart(6, '0');
            return `GR-${ano}-${seq}-${String(Math.floor(Math.random() * 99)).padStart(2, '0')}`;
        }

        function gerarPlaca() {
            const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            return `${L[Math.floor(Math.random()*26)]}${L[Math.floor(Math.random()*26)]}${L[Math.floor(Math.random()*26)]}${Math.floor(Math.random()*10)}${L[Math.floor(Math.random()*26)]}${Math.floor(Math.random()*10)}${Math.floor(Math.random()*10)}`;
        }

        function horaAtual() {
            return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function dataHoraAtual() {
            return new Date().toLocaleString('pt-BR');
        }

        // ===== LOGIN =====
        function fazerLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;

            if (usuario === USUARIO_CORRETO && senha === SENHA_CORRETA) {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('sistema').style.display = 'block';
                document.getElementById('subtitulo').textContent = 'Cobrança + Ticket + Controle de Veículos';
                document.getElementById('erroLogin').style.display = 'none';
            } else {
                document.getElementById('erroLogin').style.display = 'block';
            }
        }

        function sair() {
            if (confirm('Deseja sair do sistema?')) {
                document.getElementById('sistema').style.display = 'none';
                document.getElementById('tela-login').style.display = 'block';
                document.getElementById('subtitulo').textContent = 'Faça login para continuar';
                document.getElementById('usuario').value = '';
                document.getElementById('senha').value = '';
            }
        }

        // ===== NAVEGAÇÃO =====
        function mostrarTela(nome, botao) {
            document.querySelectorAll('#sistema .tela').forEach(t => t.classList.remove('ativa'));
            document.querySelectorAll('.menu button').forEach(b => b.classList.remove('ativo'));
            document.getElementById('tela-' + nome).classList.add('ativa');
            botao.classList.add('ativo');

            if (nome === 'clientes') renderizarClientes();
            if (nome === 'estacionamento') atualizarSelectClientes();
        }

        // ===== CLIENTES =====
        function cadastrarCliente(e) {
            e.preventDefault();
            const nome = document.getElementById('nomeCliente').value.trim();
            const cpf = document.getElementById('cpfCliente').value.trim();
            const telefone = document.getElementById('telefoneCliente').value.trim();
            const email = document.getElementById('emailCliente').value.trim();

            if (!nome || !cpf) {
                alert('Nome e CPF são obrigatórios!');
                return;
            }
            if (clientes.some(c => c.cpf === cpf)) {
                alert('Já existe um cliente com este CPF!');
                return;
            }

            clientes.push({ nome, cpf, telefone, email });
            document.getElementById('nomeCliente').value = '';
            document.getElementById('cpfCliente').value = '';
            document.getElementById('telefoneCliente').value = '';
            document.getElementById('emailCliente').value = '';
            alert('Cliente cadastrado com sucesso!');
            atualizarSelectClientes();
        }

        function renderizarClientes() {
            const lista = document.getElementById('listaClientes');
            if (clientes.length === 0) {
                lista.innerHTML = '<div class="vazio">Nenhum cliente cadastrado ainda...</div>';
                return;
            }
            lista.innerHTML = clientes.map(c => `
                <div class="cliente-card">
                    <div class="cliente-nome">${c.nome}</div>
                    <div class="cliente-info">
                        CPF: <span>${c.cpf}</span><br>
                        ${c.telefone ? `Telefone: <span>${c.telefone}</span><br>` : ''}
                        ${c.email ? `Email: <span>${c.email}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function atualizarSelectClientes() {
            const select = document.getElementById('selectCliente');
            select.innerHTML = '<option value="">-- Gerar cliente aleatório --</option>';
            clientes.forEach((c, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${c.nome} (${c.cpf})`;
                select.appendChild(opt);
            });
        }

        // ===== ESTACIONAMENTO =====
        function renderizar() {
            const lista = document.getElementById('lista');
            if (vagasOcupadas.length === 0) {
                lista.innerHTML = '<div class="vazio">Nenhum veículo estacionado ainda...</div>';
                return;
            }

            lista.innerHTML = vagasOcupadas.map(v => `
                <div class="veiculo">
                    <div class="nome-pessoa">${v.pessoa}</div>
                    <div class="nome-veiculo">${v.veiculo}</div>
                    <div class="placa">${v.placa}</div>
                    <div class="info">
                        CPF: <span>${v.cpf}</span><br>
                        GR: <span>${v.gr}</span>
                    </div>
                    <div class="horarios">
                        <div class="horario"><strong>Entrada:</strong> ${v.entrada}</div>
                    </div>
                    <button class="btn-saida" onclick="iniciarSaida(${v.vaga})">Registrar Saída + Cobrar</button>
                </div>
            `).join('');
        }

        function estacionar() {
            if (vagasLivres.length === 0) {
                alert('Estacionamento lotado!');
                return;
            }

            const select = document.getElementById('selectCliente');
            const indice = select.value;
            let pessoa, cpf;

            if (indice !== '') {
                pessoa = clientes[indice].nome;
                cpf = clientes[indice].cpf;
            } else {
                pessoa = nomesPessoas[Math.floor(Math.random() * nomesPessoas.length)];
                cpf = gerarCPF();
            }

            const numeroVaga = vagasLivres.shift();
            const agora = new Date();

            vagasOcupadas.push({
                vaga: numeroVaga,
                pessoa,
                veiculo: nomesVeiculos[Math.floor(Math.random() * nomesVeiculos.length)],
                placa: gerarPlaca(),
                cpf,
                gr: gerarGR(),
                entrada: agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                entradaDate: agora, // para calcular o tempo
                saida: null
            });

            renderizar();
        }

        // ===== COBRANÇA + TICKET =====
        function calcularValor(minutos) {
            if (minutos <= 60) return 12.00;
            const horasExtras = Math.ceil((minutos - 60) / 60);
            return 12.00 + (horasExtras * 6.00);
        }

        function formatarTempo(minutos) {
            const h = Math.floor(minutos / 60);
            const m = minutos % 60;
            if (h === 0) return `${m} min`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m}min`;
        }

        function iniciarSaida(numeroVaga) {
            const index = vagasOcupadas.findIndex(v => v.vaga === numeroVaga);
            if (index === -1) return;

            const veiculo = vagasOcupadas[index];
            const saidaDate = new Date();
            const diffMs = saidaDate - veiculo.entradaDate;
            const minutos = Math.max(1, Math.ceil(diffMs / 60000)); // mínimo 1 minuto
            const valor = calcularValor(minutos);
            const tempoFormatado = formatarTempo(minutos);
            const saidaHora = saidaDate.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            veiculoSaindo = { ...veiculo, index, saidaHora, minutos, valor, tempoFormatado };

            // Monta o ticket
            document.getElementById('conteudoTicket').innerHTML = `
                <h2>TICKET DE ESTACIONAMENTO</h2>
                <div class="empresa">Estacionamento Digital<br>CNPJ: 00.000.000/0001-00</div>
                
                <div class="linha"><span>Cliente:</span> <strong>${veiculo.pessoa}</strong></div>
                <div class="linha"><span>CPF:</span> <span>${veiculo.cpf}</span></div>
                <div class="linha"><span>Veículo:</span> <span>${veiculo.veiculo}</span></div>
                <div class="linha"><span>Placa:</span> <strong>${veiculo.placa}</strong></div>
                <div class="linha"><span>GR:</span> <span>${veiculo.gr}</span></div>
                
                <div style="margin: 12px 0; border-top: 1px dashed #000;"></div>
                
                <div class="linha"><span>Entrada:</span> <span>${veiculo.entrada}</span></div>
                <div class="linha"><span>Saída:</span> <span>${saidaHora}</span></div>
                <div class="linha"><span>Tempo:</span> <strong>${tempoFormatado}</strong></div>
                
                <div class="total">
                    <span>TOTAL A PAGAR</span>
                    <span>R$ ${valor.toFixed(2).replace('.', ',')}</span>
                </div>
                
                <div style="text-align:center; margin-top:15px; font-size:0.8rem; color:#555;">
                    ${dataHoraAtual()}
                </div>

                <div class="botoes-ticket">
                    <button class="btn-imprimir" onclick="imprimirTicket()">Imprimir Ticket</button>
                    <button class="btn-fechar-ticket" onclick="confirmarPagamento()">Pagamento OK</button>
                </div>
            `;

            document.getElementById('modalTicket').classList.add('ativo');
        }

        function imprimirTicket() {
            window.print();
        }

        function confirmarPagamento() {
            if (!veiculoSaindo) return;

            // Remove o veículo
            vagasOcupadas.splice(veiculoSaindo.index, 1);
            vagasLivres.push(veiculoSaindo.vaga);
            vagasLivres.sort((a, b) => a - b);

            veiculoSaindo = null;
            document.getElementById('modalTicket').classList.remove('ativo');
            renderizar();
            alert('Pagamento confirmado! Vaga liberada.');
        }

        function limparTudo() {
            if (vagasOcupadas.length === 0) return;
            if (confirm('Tem certeza que deseja liberar todos os veículos?')) {
                vagasOcupadas = [];
                vagasLivres = Array.from({ length: TOTAL_VAGAS }, (_, i) => i + 1);
                renderizar();
            }
        }

        // Máscara CPF
        document.getElementById('cpfCliente').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
            e.target.value = v;
        });
    </script>
</body>
</html>
